[project]
name = "taskflow"
version = "0.1.0"
description = "TaskFlow Backend API built with FastAPI, PostgreSQL, Redis, and Celery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
