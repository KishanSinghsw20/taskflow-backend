version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: taskflow_app
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TaskFlow
      - DEBUG=False
      - SECRET_KEY=prod_super_secret_key_32_bytes_min_length_taskflow
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/taskflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: taskflow_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - PROJECT_NAME=TaskFlow
      - SECRET_KEY=prod_super_secret_key_32_bytes_min_length_taskflow
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/taskflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: taskflow_beat
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    environment:
      - PROJECT_NAME=TaskFlow
      - SECRET_KEY=prod_super_secret_key_32_bytes_min_length_taskflow
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/taskflow
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
